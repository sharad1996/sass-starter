name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/saas_ci
      JWT_ACCESS_SECRET: "01234567890123456789012345678901"
      JWT_REFRESH_SECRET: "0123456789012345678901234567890x"
      ACCESS_TOKEN_EXPIRES: 15m
      REFRESH_TOKEN_EXPIRES_DAYS: 7
      CORS_ORIGIN: http://localhost:3000
      STRIPE_WEBHOOK_SECRET: whsec_ci
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test API
        run: npm run test
      - name: Build API
        run: npm run build -w @saas/api
      - name: Build Web
        run: npm run build -w @saas/web
